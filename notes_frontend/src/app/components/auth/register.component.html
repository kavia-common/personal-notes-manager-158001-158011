<div class="auth-wrap">
  <div class="card">
    <h2>Create account</h2>
    <p class="sub">Start managing your notes</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Name</label>
      <input type="text" formControlName="displayName" placeholder="Your name" />
      <div class="error" *ngIf="form.controls.displayName.touched && form.controls.displayName.invalid">
        Name is required.
      </div>

      <label>Email</label>
      <input type="email" formControlName="email" placeholder="you@example.com" />
      <div class="error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
        Enter a valid email.
      </div>

      <label>Password</label>
      <input type="password" formControlName="password" placeholder="At least 6 characters" />
      <div class="error" *ngIf="form.controls.password.touched && form.controls.password.invalid">
        Password must be at least 6 characters.
      </div>

      <button class="btn btn-primary" type="submit">Create Account</button>
      <div class="error" *ngIf="error">{{ error }}</div>
    </form>

    <div class="alt">
      Have an account? <a routerLink="/login">Sign in</a>
    </div>
  </div>
</div>
